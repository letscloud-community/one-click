name: n8n

# Values come from /opt/n8n/.env, generated per instance on first boot by
# /opt/n8n/n8n-init.sh. See /opt/n8n/.env.example for the full list.

volumes:
  n8n_data:
  db_data:

# Explicit network rather than the implicit "default", so the stack never
# collides with an unrelated "n8n_default" network on the host.
networks:
  internal:

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      # Postgres 18 moved its default data directory; pinning PGDATA keeps the
      # volume mount valid across major versions.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: docker.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    # Only nginx talks to n8n; never publish 5678 on a public interface.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - NODE_ENV=production
      - N8N_HOST=${N8N_HOSTNAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_WEBHOOK_URL}
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      # The broker only listens on localhost by default, which the sidecar
      # runner container cannot reach.
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL}
      - N8N_LOG_OUTPUT=console
      # Pinned because n8n announced these defaults will change; setting them
      # explicitly keeps upgrades predictable. See /opt/n8n/.env.
      - N8N_UNVERIFIED_PACKAGES_ENABLED=${N8N_UNVERIFIED_PACKAGES_ENABLED}
      - N8N_RUNNERS_TASK_TIMEOUT=${N8N_RUNNERS_TASK_TIMEOUT}
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=${N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES}
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=${N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES}
    volumes:
      - n8n_data:/home/node/.n8n
      - /opt/n8n/files:/home/node/.n8n-files
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Executes Code node scripts in an isolated process. Internal mode is
  # deprecated and will be removed in n8n 3.0, so this stack uses external mode.
  # Never publish this container's ports.
  runners:
    image: docker.io/n8nio/runners:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      - n8n
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
