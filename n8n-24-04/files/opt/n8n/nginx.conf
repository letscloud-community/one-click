# Only send "Connection: upgrade" for requests that actually ask for it, so
# plain HTTP requests keep normal keepalive semantics.
map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream n8n {
    server 127.0.0.1:5678;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/n8n.access.log;
    error_log /var/log/nginx/n8n.error.log;

    # Workflows routinely move large binary payloads through webhooks.
    client_max_body_size 100m;

    location / {
        proxy_pass http://n8n;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # The editor keeps a long-lived push connection open, and single
        # workflow executions can run for a long time.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $n8n_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
